services:
 
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    restart: always
    environment:
      ACCEPT_EULA: Y
      # SQL Server refuses to start unless the password it is given is at
      # least eight characters from three of: uppercase, lowercase, digits,
      # symbols.
      MSSQL_SA_PASSWORD: For-Testing1
    volumes:
      - ./sqlserver_data/data:/var/opt/mssql/data
      - ./sqlserver_data/log:/var/opt/mssql/log
      - ./sqlserver_data/secrets:/var/opt/mssql/secrets
    ports:
        - 1433:1433
